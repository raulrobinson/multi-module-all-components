spring:
  main:
    lazy-initialization: true
  application:
    name: ${SPRING_APPLICATION_NAME:archetype-multi-api}

# ── App metadata (exposed via /actuator/info) ──────────────────────────────────
info:
  app:
    name: "Archetype — Multi-API Composition"
    description: "Spring WebFlux archetype with AWS Secrets Manager, Parameter Store and dynamic Resilience4j."
    version: "1.0.0"
    encoding: "UTF-8"
    java:
      version: "21"

# ── Server ─────────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}

# ── Springdoc / Swagger ────────────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true
  show-actuator: false

# ── AWS ────────────────────────────────────────────────────────────────────────
aws:
  #region: ${AWS_REGION:us-east-1}
  # Override only for local development with LocalStack — leave empty in production
  #endpoint-local: ${AWS_ENDPOINT_URL:}
  parameters:
    region: ${AWS_PARAMETER_REGION:us-east-1
    endpoint-override: ${AWS_PARAMETER_ENDPOINT_URL:http://localhost:4566}

# ── AWS SSM Parameter Store paths ─────────────────────────────────────────────
# These paths are resolved at runtime by SsmParameterAdapter (cached 12 h).
# Actual values live in AWS SSM — not here.
#
#   /archetype/alpha/endpoint          → base URL of Alpha API
#   /archetype/beta/endpoint           → base URL of Beta API
#   /archetype/gamma/endpoint          → base URL of Gamma API
#
#   /archetype/resilience/alpha-client/cb/sliding-window-size
#   /archetype/resilience/alpha-client/cb/minimum-calls
#   /archetype/resilience/alpha-client/cb/failure-rate-threshold
#   /archetype/resilience/alpha-client/cb/wait-duration-open-state-seconds
#   /archetype/resilience/alpha-client/cb/permitted-calls-half-open
#   /archetype/resilience/alpha-client/retry/max-attempts
#   /archetype/resilience/alpha-client/retry/wait-duration-millis
#   /archetype/resilience/alpha-client/retry/multiplier
#   (same paths for beta-client and gamma-client)

# ── AWS Secrets Manager paths ─────────────────────────────────────────────────
# Resolved at runtime by SecretsManagerAdapter (cached 12 h).
#
#   /archetype/alpha/apikey            → API key injected as X-Api-Key header
#   /archetype/beta/apikey             → API key injected as X-Api-Key header
#   /archetype/gamma/token             → Bearer token injected as Authorization header

# ── Client timeout overrides (optional — defaults shown) ──────────────────────
alpha:
  connect-timeout-ms:  ${ALPHA_CONNECT_TIMEOUT_MS:5000}
  response-timeout-ms: ${ALPHA_RESPONSE_TIMEOUT_MS:12000}

beta:
  connect-timeout-ms:  ${BETA_CONNECT_TIMEOUT_MS:5000}
  response-timeout-ms: ${BETA_RESPONSE_TIMEOUT_MS:12000}

gamma:
  connect-timeout-ms:  ${GAMMA_CONNECT_TIMEOUT_MS:5000}
  response-timeout-ms: ${GAMMA_RESPONSE_TIMEOUT_MS:12000}

# ── Resilience4j boot defaults ─────────────────────────────────────────────────
# These serve as safety-net fallbacks if SSM is unreachable at startup.
# DynamicResilienceFactory overrides them at first request with SSM values.
resilience4j:
  circuitbreaker:
    instances:
      alpha-client:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
      beta-client:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
      gamma-client:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true

# ── Actuator ────────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus,circuitbreakers"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true

# ── Logging ─────────────────────────────────────────────────────────────────────
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.example: ${APP_LOG_LEVEL:DEBUG}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %cyan(%logger{36}) - %msg%n"
